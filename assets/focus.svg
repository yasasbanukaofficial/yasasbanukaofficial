<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 168" width="100%">
  <!-- Card 1: AI & LLM Engineering -->
  <rect x="0" y="0" width="410" height="168" rx="16" fill="#F4F2ED"/>
  <rect x="0" y="0" width="410" height="168" rx="16" fill="none" stroke="#a8d5d8" stroke-width="1.5"/>
  
  <!-- Animated Neural / RAG Graphic -->
  <g transform="translate(24, 22)">
    <line x1="8" y1="14" x2="26" y2="6" stroke="#a8d5d8" stroke-width="2"/>
    <line x1="8" y1="14" x2="26" y2="22" stroke="#a8d5d8" stroke-width="2"/>
    <line x1="26" y1="6" x2="42" y2="14" stroke="#1e3a5f" stroke-width="2"/>
    <line x1="26" y1="22" x2="42" y2="14" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="8" cy="14" r="4.5" fill="#1e3a5f"/>
    <circle cx="26" cy="6" r="4" fill="#a8d5d8"/>
    <circle cx="26" cy="22" r="4" fill="#a8d5d8"/>
    <circle cx="42" cy="14" r="5" fill="#e85d5d">
      <animate attributeName="r" values="4.5;6;4.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="14" r="2" fill="#ffffff">
      <animate attributeName="cx" values="8;26;42" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="14;6;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="80" y="42" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">AI &amp; LLM Engineering</text>
  <rect x="24" y="58" width="362" height="1.5" fill="#a8d5d8" opacity="0.6"/>
  
  <circle cx="30" cy="82" r="3" fill="#e85d5d"/>
  <text x="42" y="87" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e3a5f">RAG Pipelines &amp; Agents • LangChain, Chroma</text>
  
  <circle cx="30" cy="110" r="3" fill="#e85d5d"/>
  <text x="42" y="115" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e3a5f">LLM Internals • QLoRA, 4bit NF4, Transformers</text>
  
  <circle cx="30" cy="138" r="3" fill="#e85d5d"/>
  <text x="42" y="143" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e3a5f">ML &amp; Data • TensorFlow, Sklearn, Pandas, NumPy</text>

  <!-- Card 2: Backend & Distributed Systems -->
  <rect x="430" y="0" width="410" height="168" rx="16" fill="#F4F2ED"/>
  <rect x="430" y="0" width="410" height="168" rx="16" fill="none" stroke="#a8d5d8" stroke-width="1.5"/>
  
  <!-- Animated Distributed Nodes Graphic -->
  <g transform="translate(454, 22)">
    <rect x="2" y="8" width="12" height="12" rx="3" fill="#1e3a5f"/>
    <rect x="34" y="2" width="10" height="10" rx="2.5" fill="#a8d5d8"/>
    <rect x="34" y="16" width="10" height="10" rx="2.5" fill="#e85d5d"/>
    <path d="M14 14 L34 7 M14 14 L34 21" stroke="#1e3a5f" stroke-width="1.8" stroke-dasharray="3 2">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="510" y="42" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">Backend &amp; Distributed</text>
  <rect x="454" y="58" width="362" height="1.5" fill="#a8d5d8" opacity="0.6"/>
  
  <circle cx="460" cy="82" r="3" fill="#1e3a5f"/>
  <text x="472" y="87" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e3a5f">Microservices • Java, Spring Boot, Spring Cloud</text>
  
  <circle cx="460" cy="110" r="3" fill="#1e3a5f"/>
  <text x="472" y="115" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e3a5f">APIs &amp; Data • Gateways, JWT, Postgres, MongoDB</text>
  
  <circle cx="460" cy="138" r="3" fill="#1e3a5f"/>
  <text x="472" y="143" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e3a5f">Cloud &amp; Ops • Docker, Linux, Prometheus, Grafana</text>
</svg>